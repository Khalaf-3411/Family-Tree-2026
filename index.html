// Plain REST calls instead of the Firebase SDK
async function firestoreGet(docName){
  const res = await fetch(FIRESTORE_BASE+'/'+docName+'?key='+FIREBASE_API_KEY);
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('Firestore GET failed: '+res.status);
  const json = await res.json();
  return (json.fields && json.fields.data) ? JSON.parse(json.fields.data.stringValue) : null;
}
async function firestoreSet(docName, dataValue){
  const body = { fields: { data: { stringValue: JSON.stringify(dataValue) } } };
  const res = await fetch(FIRESTORE_BASE+'/'+docName+'?key='+FIREBASE_API_KEY, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('Firestore SET failed: '+res.status);
}

const FAMILY_COLORS = ['#c9a24b','#83967a','#b5715f','#6f93a8','#9b83ad','#c48a4c'];

function familyColor(family){
  const key = (family || 'Unrecorded').trim().toLowerCase();
  let hash = 0;
  for(let i=0;i<key.length;i++){ hash = (hash*31 + key.charCodeAt(i)) >>> 0; }
  return FAMILY_COLORS[hash % FAMILY_COLORS.length];
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtYear(d){
  if(!d) return '';
  const parts = d.split('-');
  return parts.length===3 ? parts[0] : d;
}
function lifespan(e){
  const b = fmtYear(e.birth), dth = fmtYear(e.death);
  if(!b && !dth) return '';
  if(b && dth) return 'b. '+b+' \u2013 d. '+dth;
  return b ? 'b. '+b : 'd. '+dth;
}
function wrapName(text, maxChars){
  if(text.length <= maxChars) return [text];
  const words = text.split(' ');
  let line1 = '', line2 = '';
  words.forEach(w=>{
    if(!line1 || (line1 + ' ' + w).length <= maxChars){ line1 = line1 ? line1+' '+w : w; }
    else { line2 = line2 ? line2+' '+w : w; }
  });
  return line2 ? [line1, line2] : [line1];
}
function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h<<5)+h + str.charCodeAt(i))|0; }
  return (h>>>0).toString(36);
}

// ---- Core identity helpers ----
function getEntryById(id){ return entries.find(e=>e.id===id) || null; }
function fullNameFor(entry){
  if(!entry) return '';
  const father = entry.fatherId ? getEntryById(entry.fatherId) : null;
  const grandfather = father && father.fatherId ? getEntryById(father.fatherId) : null;
  return [entry.name, father ? father.name : null, grandfather ? grandfather.name : null].filter(Boolean).join(' ');
}
function motherLabelFor(entry){
  if(entry.motherId){ return fullNameFor(getEntryById(entry.motherId)); }
  return entry.motherText || '';
}
function ancestorIdsOf(id){
  const result = new Set();
  function climb(curId){
    const e = getEntryById(curId);
    if(!e) return;
    [e.fatherId, e.motherId].forEach(pid=>{
      if(pid && !result.has(pid)){ result.add(pid); climb(pid); }
    });
  }
  climb(id);
  return result;
}

// ---- Migration helper ----
function migrateLegacyEntries(raw){
  const isLegacy = raw.some(e => e.fatherId === undefined && (e.father !== undefined || e.mother !== undefined));
  if(!isLegacy) return {migrated: raw, changed: false};

  function byGivenName(text){
    const norm = (text||'').trim().toLowerCase();
    return raw.filter(e=>(e.name||'').trim().toLowerCase() === norm);
  }
  function fullNameOfLegacy(e){
    return [e.name, e.father, e.grandfather].filter(Boolean).join(' ').trim().toLowerCase();
  }
  function byFullNameLegacy(text){
    const norm = (text||'').trim().toLowerCase();
    return raw.filter(e=>{
      const bare = fullNameOfLegacy(e);
      const withFamily = (bare + ' ' + (e.family||'').trim()).trim().toLowerCase();
      return bare === norm || withFamily === norm;
    });
  }

  const migrated = raw.map(e=>{
    let fatherId = null, motherId = null, motherText = '';
    if(e.father && e.father.trim()){
      const cands = byGivenName(e.father);
      let match = null;
      if(e.grandfather && e.grandfather.trim()){
        const gnorm = e.grandfather.trim().toLowerCase();
        const consistent = cands.filter(c=>(c.father||'').trim().toLowerCase() === gnorm);
        if(consistent.length === 1) match = consistent[0];
      }
      if(!match && cands.length === 1) match = cands[0];
      if(match) fatherId = match.id;
    }
    if(e.mother && e.mother.trim()){
      const fm = byFullNameLegacy(e.mother);
      if(fm.length === 1) motherId = fm[0].id;
      else motherText = e.mother.trim();
    }
    return {
      id: e.id, name: e.name, family: e.family || '', birth: e.birth || '', death: e.death || '', photo: e.photo || '',
      fatherId, motherId, motherText
    };
  });
  return {migrated, changed: true};
}

function inferMissingGenders(list){
  let changed = false;
  list.forEach(e=>{
    if(e.gender === undefined){
      const isFather = list.some(x=>x.fatherId === e.id);
      const isMother = list.some(x=>x.motherId === e.id);
      e.gender = isFather ? 'male' : (isMother ? 'female' : null);
      changed = true;
    }
  });
  return changed;
}

async function loadEntries(){

      await new Promise(r=>setTimeout(r, 1200));
      fetched = await firestoreGet('entries');
    }
    if(fetched === null){
      entries = buildSeedEntries();
      usingSeedFallback = true;
      connectionError = false;
      return;
    }
    const {migrated, changed} = migrateLegacyEntries(fetched);

}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 200;
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function buildGraph(){
  const nodes = new Map();
  entries.forEach(e=>{
    nodes.set(e.id, {
      key: e.id, name: e.name, family: e.family || '', birth: e.birth || '', death: e.death || '',
      photo: e.photo || '', motherText: e.motherId ? '' : (e.motherText || ''),
      fatherId: e.fatherId || null, motherId: e.motherId || null,
      displayName: fullNameFor(e),
      parents: [e.fatherId, e.motherId].filter(Boolean)
    });
  });
  return nodes;
}

function computeLayout(nodes){
  const depthCache = new Map();
  function getDepth(key, visiting){
    if(depthCache.has(key)) return depthCache.get(key);
    if(visiting.has(key)) return 0;
    visiting.add(key);
    const node = nodes.get(key);
    if(!node.parents.length){ depthCache.set(key,0); return 0; }
    let maxP = -1;
    node.parents.forEach(p=>{ if(nodes.has(p)){ maxP = Math.max(maxP, getDepth(p, visiting)); } });
    const d = maxP + 1;
    depthCache.set(key, d);
    return d;
  }
  nodes.forEach((n,key)=>getDepth(key, new Set()));

  const levels = {};
  nodes.forEach((n,key)=>{ const d = depthCache.get(key); (levels[d] = levels[d] || []).push(key); });
  const maxDepth = Math.max(0, ...Object.keys(levels).map(Number));

  const spacingX = 244, spacingY = 244, nodeW = 200, nodeH = 140;
  const positions = {};
  function barycenter(key){
    const node = nodes.get(key);
    const ps = node.parents.filter(p=>positions[p]);
    if(!ps.length) return 1e9;
    if(ps.length === 2){
      const [pa, pb] = ps;
      if(positions[pa].y !== positions[pb].y && node.motherId && positions[node.motherId]){
        return positions[node.motherId].x;
      }
    }
    return ps.reduce((s,p)=>s+positions[p].x,0)/ps.length;
  }
  for(let d=0; d<=maxDepth; d++){
    const keys = (levels[d] || []).slice();
    if(d===0){ keys.sort((a,b)=>nodes.get(a).name.localeCompare(nodes.get(b).name)); }
    else { keys.sort((a,b)=>barycenter(a)-barycenter(b) || nodes.get(a).name.localeCompare(nodes.get(b).name)); }

    let cursorX = 0;
    let prevParentKey = undefined;
    keys.forEach((key)=>{
      const node = nodes.get(key);
      const thisParentKey = node.parents[0] || null;
      if(prevParentKey !== undefined && thisParentKey !== prevParentKey){ cursorX += spacingX * 1.4; }
      positions[key] = {x: cursorX, y: d*spacingY, depth:d};
      cursorX += spacingX;
      prevParentKey = thisParentKey;
    });
  }
  let widest = 0;
  for(let d=0; d<=maxDepth; d++){
    const keys = levels[d] || [];
    if(keys.length){
      const last = positions[keys[keys.length-1]].x;
      widest = Math.max(widest, last);
    }
  }
  for(let d=0; d<=maxDepth; d++){
    const keys = levels[d] || [];
    if(!keys.length) continue;
    const levelWidth = positions[keys[keys.length-1]].x;
    const offset = (widest - levelWidth)/2;
    keys.forEach(key=>{ positions[key].x += offset; });
  }
  const width = widest + nodeW + 80;
  const height = (maxDepth+1)*spacingY + nodeH + 60;
  return {positions, width, height, nodeW, nodeH};
}

function renderTree(){
  const nodes = buildGraph();
  const container = document.getElementById('canvas-inner');
  if(!container) return;
  if(nodes.size === 0){
    container.innerHTML = '<div class="empty-canvas">The tree is empty. Add the first person on the left to begin.</div>';
    renderLegend(nodes);
    return;
  }
  const {positions, width, height, nodeW, nodeH} = computeLayout(nodes);
  const padX = 40, padY = 30;

  let defs = '';
  let branches = '';
  let svg = '';
  let clipIndex = 0;
  const photoByIndex = {};

  nodes.forEach((node)=>{
    const pos = positions[node.key];
    const cx = pos.x + padX + nodeW/2, cy = pos.y + padY;
    const parentsPositioned = node.parents.filter(p=>positions[p]);
    const col = familyColor(node.family);

    if(parentsPositioned.length > 0){
      const parentXs = parentsPositioned.map(pKey => positions[pKey].x + padX + nodeW/2);
      const parentYs = parentsPositioned.map(pKey => positions[pKey].y + padY + nodeH);
      const startX = parentXs.reduce((a, b) => a + b, 0) / parentXs.length;
      const startY = Math.max(...parentYs);
      const bendY = startY + (cy - startY) / 2;

      branches += '<path class="branch" d="M '+startX+' '+startY+' L '+startX+' '+bendY+' L '+cx+' '+bendY+' L '+cx+' '+cy+'" stroke="'+col+'" opacity="0.85" fill="none"/>';
    }
  });

  nodes.forEach((node)=>{
    const pos = positions[node.key];
    const x = pos.x + padX, y = pos.y + padY;
    const col = familyColor(node.family);
    const life = lifespan(node);
    const nameLines = wrapName(node.displayName, 22);
    const textX = node.photo ? x+42 : x+16;
    const motherLines = node.motherText ? wrapName('m. '+node.motherText, 26) : [];
    const lineGap = 16;

    const rowCount = nameLines.length + 1 + motherLines.length + (life ? 1 : 0);
    const contentHeight = rowCount * 16;
    const topPad = Math.max(14, (nodeH - contentHeight) / 2);
    const nameStartY = y + topPad + 12;

    const nameSvg = nameLines.map((ln,i)=>'<text class="node-name" x="'+textX+'" y="'+(nameStartY+i*lineGap)+'" font-size="14">'+esc(ln)+'</text>').join('');
    const afterNameY = nameStartY + (nameLines.length-1)*lineGap;
    const avatarCy = nameStartY - 14;
    let avatar = '<circle cx="'+(x+16)+'" cy="'+avatarCy+'" r="4" fill="'+col+'"/>';
    if(node.photo){
      const photoIdx = clipIndex;
      const cid = 'clip'+(clipIndex++);
      defs += '<clipPath id="'+cid+'"><circle cx="'+(x+18)+'" cy="'+(avatarCy+2)+'" r="14"/></clipPath>';
      avatar = '<g class="node-photo" data-photo-index="'+photoIdx+'" style="cursor:zoom-in">'
        + '<image href="'+node.photo+'" x="'+(x+4)+'" y="'+(avatarCy-10)+'" width="28" height="28" clip-path="url(#'+cid+')" preserveAspectRatio="xMidYMid slice"/>'
        + '<circle cx="'+(x+18)+'" cy="'+(avatarCy+2)+'" r="14" fill="none" stroke="'+col+'" stroke-width="1.4"/>'
        + '</g>';
      photoByIndex[photoIdx] = node.photo;
    }
    svg += '<g class="fam-node" data-id="'+esc(node.key)+'" style="cursor:pointer">'
      + '<rect class="node-card" x="'+x+'" y="'+y+'" width="'+nodeW+'" height="'+nodeH+'" rx="10" style="stroke:'+col+'"/>'
      + avatar
      + nameSvg
      + '<text class="node-family" x="'+textX+'" y="'+(afterNameY+16)+'" font-size="10.5" fill="'+col+'">'+esc((node.family || 'unrecorded').toUpperCase())+'</text>';
    let rowY = afterNameY + 32;
    if(motherLines.length){
      motherLines.forEach((ln,i)=>{
        svg += '<text class="node-mother" x="'+textX+'" y="'+(rowY+i*13)+'" font-size="10">'+esc(ln)+'</text>';
      });
      rowY += motherLines.length*13 + 3;
    }
    if(life){
      svg += '<text class="node-dates" x="'+textX+'" y="'+rowY+'" font-size="10">'+esc(life)+'</text>';
    }
    svg += '</g>';
  });

  const containerWidth = container.clientWidth || width;
  const fitScale = containerWidth / width;
  const finalScale = fitScale * zoomLevel;
  const renderedWidth = Math.round(width * finalScale);
  const renderedHeight = Math.round(height * finalScale);
  container.innerHTML = '<svg viewBox="0 0 '+width+' '+height+'" style="display:block;width:'+renderedWidth+'px;height:'+renderedHeight+'px"><defs>'+defs+'</defs>'+branches+svg+'</svg>';

  container.querySelectorAll('.fam-node').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-id');
      const select = document.getElementById('f-father-select');
      if(select && !select.value){ select.value = id; select.dispatchEvent(new Event('change')); }
      document.getElementById('f-name').scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
  container.querySelectorAll('.node-photo').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const idx = el.getAttribute('data-photo-index');
      const src = photoByIndex[idx];
      if(src) openLightbox(src);
    });
  });
  renderLegend(nodes);
  const zoomLabel = document.getElementById('zoom-level');
  if(zoomLabel) zoomLabel.textContent = Math.round(zoomLevel * 100) + '%';
}

function openLightbox(src){
  const overlay = document.getElementById('photo-lightbox');
  const img = document.getElementById('lightbox-img');
  if(!overlay || !img) return;
  img.src = src;
  overlay.style.display = 'flex';
}

function renderLegend(nodes){
  const families = new Set();
  nodes.forEach(n=>families.add((n.family||'unrecorded').trim() || 'unrecorded'));
  const legend = document.getElementById('legend');
  if(!legend) return;
  legend.innerHTML = families.size ? [...families].map(f=>'<span><i style="background:'+familyColor(f)+'"></i>'+esc(f)+'</span>').join('') : '';
}

function renderEntries(){
  const list = document.getElementById('entry-list');
  if(!list) return;
  if(!entries.length){ list.innerHTML = '<p class="empty">No one has been added yet.</p>'; return; }
  list.innerHTML = entries.slice().reverse().map(e=>{
    const father = e.fatherId ? fullNameFor(getEntryById(e.fatherId)) : '';
    const mother = motherLabelFor(e);
    const parents = [mother, father].filter(Boolean).join(' & ') || 'no parents recorded';
    const life = lifespan(e);
    const col = familyColor(e.family);
    const thumb = e.photo
      ? '<img class="thumb" src="'+e.photo+'" style="cursor:zoom-in">'
      : '<div class="thumb-fallback" style="background:'+col+'22;color:'+col+';">'+esc((e.name||'?')[0].toUpperCase())+'</div>';
    return '<div class="entry-row">'
      + '<div class="entry-left">'+thumb+'<div>'
      + '<div class="entry-name">'+esc(fullNameFor(e))+'</div>'
      + '<div class="entry-meta">'+esc(parents)+' &middot; '+esc(e.family || 'unrecorded')+(life ? ' &middot; '+esc(life) : '')+'</div>'
      + '</div></div>'
      + '<div class="entry-actions">'
      + '<button class="btn-ghost" data-edit-id="'+e.id+'">edit</button>'
      + '<button class="btn-ghost" data-id="'+e.id+'">remove</button>'
      + '</div>'
      + '</div>';
  }).join('');
  list.querySelectorAll('img.thumb').forEach(img=>{
    img.addEventListener('click', ()=>openLightbox(img.src));
  });
  list.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingDeleteId = btn.getAttribute('data-id');
      openPinModal(adminPinHash ? 'verify' : 'set');
    });
  });
  list.querySelectorAll('button[data-edit-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      startEdit(btn.getAttribute('data-edit-id'));
    });
  });
}

function renderAll(){
  populateParentDropdowns();
  renderEntries();
  renderTree();
}

async function refreshFromStorage(){ await loadEntries(); renderAll(); }

function populateParentDropdowns(){
  const fatherSelect = document.getElementById('f-father-select');
  const motherSelect = document.getElementById('f-mother-select');
  if(!fatherSelect || !motherSelect) return;
  const prevFather = fatherSelect.value, prevMother = motherSelect.value;

  let excluded = new Set();
  if(editingId){
    excluded.add(editingId);
    entries.forEach(e=>{ if(ancestorIdsOf(e.id).has(editingId)) excluded.add(e.id); });
  }
  const toOption = e => ({id:e.id, label: fullNameFor(e) + (e.family ? ' ('+e.family+')' : '')});
  const fatherOptions = entries
    .filter(e=>!excluded.has(e.id) && e.gender !== 'female')
    .map(toOption).sort((a,b)=>a.label.localeCompare(b.label));
  const motherOptions = entries
    .filter(e=>!excluded.has(e.id) && e.gender !== 'male')
    .map(toOption).sort((a,b)=>a.label.localeCompare(b.label));

  fatherSelect.innerHTML = '<option value="">— none / unknown —</option>' +
    fatherOptions.map(o=>'<option value="'+o.id+'">'+esc(o.label)+'</option>').join('');
  motherSelect.innerHTML = '<option value="">— not in this tree —</option>' +
    motherOptions.map(o=>'<option value="'+o.id+'">'+esc(o.label)+'</option>').join('');

  if([...fatherSelect.options].some(o=>o.value === prevFather)) fatherSelect.value = prevFather;
  if([...motherSelect.options].some(o=>o.value === prevMother)) motherSelect.value = prevMother;
}

function startEdit(id){
  const e = getEntryById(id);
  if(!e) return;
  editingId = id;
  populateParentDropdowns();
  document.getElementById('f-name').value = e.name || '';
  document.getElementById('f-gender').value = e.gender || '';
  document.getElementById('f-father-select').value = e.fatherId || '';
  document.getElementById('f-mother-select').value = e.motherId || '';
  document.getElementById('f-mother-text').value = e.motherId ? '' : (e.motherText || '');
  document.getElementById('f-family').value = e.family || '';
  document.getElementById('f-birth').value = e.birth || '';
  document.getElementById('f-death').value = e.death || '';
  pendingPhotoData = e.photo || '';
  const preview = document.getElementById('photo-preview');
  if(e.photo){ preview.src = e.photo; preview.style.display = 'block'; }
  else { preview.style.display = 'none'; }
  document.getElementById('form-title').textContent = 'Edit ' + (e.name || 'person');
  document.getElementById('f-submit').textContent = 'Save changes';
  document.getElementById('f-cancel').style.display = 'inline-block';
  document.getElementById('f-err').style.display = 'none';
  document.getElementById('f-name').scrollIntoView({behavior:'smooth', block:'center'});
}

function cancelEdit(){
  editingId = null;
  document.getElementById('f-name').value = '';
  document.getElementById('f-gender').value = '';
  document.getElementById('f-mother-select').value = '';
  document.getElementById('f-mother-text').value = '';
  document.getElementById('f-father-select').value = '';
  document.getElementById('f-family').value = '';
  document.getElementById('f-birth').value = '';
  document.getElementById('f-death').value = '';
  document.getElementById('f-photo').value = '';
  document.getElementById('photo-preview').style.display = 'none';
  pendingPhotoData = '';
  populateParentDropdowns();
  document.getElementById('form-title').textContent = 'Add a person';
  document.getElementById('f-submit').textContent = 'Add to the tree';
  document.getElementById('f-cancel').style.display = 'none';
  document.getElementById('f-err').style.display = 'none';
}

function openPinModal(mode){
  const overlay = document.getElementById('pin-overlay');
  const title = document.getElementById('pin-title');
  const msg = document.getElementById('pin-msg');
  const input = document.getElementById('pin-input');
  const confirm = document.getElementById('pin-confirm');
  const err = document.getElementById('pin-err');
  overlay.dataset.mode = mode;
  input.value = ''; confirm.value = ''; err.style.display = 'none';
  if(mode === 'set'){
    title.textContent = 'Set a removal PIN';
    msg.textContent = 'Choose a PIN. From now on, removing anyone from the tree requires it — keep it to yourself.';
    confirm.style.display = 'block';
  } else {
    title.textContent = 'Enter the removal PIN';
    msg.textContent = 'This tree is protected. Enter the PIN to remove this person.';
    confirm.style.display = 'none';
  }
  overlay.style.display = 'flex';
  input.focus();
}
function closePinModal(){
  document.getElementById('pin-overlay').style.display = 'none';
  pendingDeleteId = null;
}
async function performDelete(id){
  entries = entries.filter(e=>e.id !== id);
  entries.forEach(e=>{
    if(e.fatherId === id) e.fatherId = null;
    if(e.motherId === id) e.motherId = null;
  });
  await saveEntries();
  renderAll();
}

function renderApp(){
  const app = document.getElementById('app');
  app.classList.remove('loading');
  app.innerHTML =
    '<div class="layout"><div class="side-col">'
    + '<div class="panel no-print"><h2 id="form-title">Add a person</h2>'
    + '<p class="hint">Pick this person\'s father and mother from the list of people already recorded. If a parent isn\'t listed yet, add them first as their own entry (leave their own father/mother blank if unknown), then come back and select them here.</p>'
    + '<label class="req">First name</label><input id="f-name" placeholder="e.g. Mohammed">'
    + '<label class="req">Gender</label><select id="f-gender"><option value="">Select…</option><option value="male">Male</option><option value="female">Female</option></select>'
    + '<label>Father</label><select id="f-father-select"></select>'
    + '<label>Mother</label><select id="f-mother-select"></select>'
    + '<input id="f-mother-text" placeholder="Or type her name if she isn\'t in this tree" style="margin-top:8px;">'
    + '<p class="field-hint">Pick her from the list only if she\'s a blood member of this family (like a daughter who married out). Otherwise just type her name — she\'ll show as a label on her child\'s card.</p>'
    + '<label>Family name</label><input id="f-family" placeholder="e.g. Al-Ismaily">'
    + '<div class="row2"><div><label>Date of birth</label><input id="f-birth" type="date"></div>'
    + '<div><label>Date of death</label><input id="f-death" type="date"></div></div>'
    + '<label>Photo</label><input id="f-photo" type="file" accept="image/*">'
    + '<img id="photo-preview" class="photo-preview">'
    + '<div class="err" id="f-err"></div>'
    + '<div class="form-actions"><button class="btn-primary" id="f-submit">Add to the tree</button>'
    + '<button class="btn-ghost" id="f-cancel" style="display:none;">Cancel edit</button></div>'
    + '</div>'
    + '<div class="panel entries"><h2>Everyone recorded</h2><p class="hint no-print">Removing someone requires the tree\'s PIN.</p><div id="entry-list"></div></div>'
    + '</div>'
    + '<div class="canvas-panel"><div class="legend-row"><div class="legend" id="legend"></div>'
    + '<div class="no-print zoom-controls"><button class="btn-refresh" id="zoom-out">\u2212</button><span id="zoom-level">100%</span><button class="btn-refresh" id="zoom-in">+</button><button class="btn-refresh" id="zoom-reset">reset</button> <button class="btn-print" id="print-btn">print</button> <button class="btn-refresh" id="refresh-btn">refresh</button> <button class="btn-refresh" id="export-btn">export</button> <button class="btn-refresh" id="import-btn">import</button><input type="file" id="import-file" accept="application/json" style="display:none;"> <button class="btn-refresh" id="change-pins-btn">change PINs</button></div></div>'
    + '<p class="print-hint no-print" id="print-hint">If "print" doesn\'t open a dialog, use your browser\'s own print shortcut (Ctrl/Cmd+P) instead.</p>'
    + '<div class="canvas-inner" id="canvas-inner"></div></div>'
    + '</div>';

  document.getElementById('f-father-select').addEventListener('change', (ev)=>{
    const familyField = document.getElementById('f-family');
    if(!familyField.value.trim() && ev.target.value){
      const father = getEntryById(ev.target.value);
      if(father && father.family) familyField.value = father.family;
    }
  });
  document.getElementById('f-mother-select').addEventListener('change', (ev)=>{
    if(ev.target.value){ document.getElementById('f-mother-text').value = ''; }
  });

  document.getElementById('f-photo').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    try{
      pendingPhotoData = await compressImage(file);
      const preview = document.getElementById('photo-preview');
      preview.src = pendingPhotoData;
      preview.style.display = 'block';
    }catch(e){
      document.getElementById('f-err').textContent = "Couldn't read that photo. Try a different file.";
      document.getElementById('f-err').style.display = 'block';
    }
  });

  document.getElementById('f-submit').addEventListener('click', async ()=>{
    const name = document.getElementById('f-name').value.trim();
    const gender = document.getElementById('f-gender').value || null;
    const fatherId = document.getElementById('f-father-select').value || null;
    const motherSelectVal = document.getElementById('f-mother-select').value || null;
    const motherTextVal = document.getElementById('f-mother-text').value.trim();
    let family = document.getElementById('f-family').value.trim();
    const birth = document.getElementById('f-birth').value;
    const death = document.getElementById('f-death').value;
    const err = document.getElementById('f-err');

    if(!name){ err.textContent = 'Enter a name first.'; err.style.display = 'block'; return; }
    if(!gender){ err.textContent = 'Select a gender — it keeps the father/mother lists accurate.'; err.style.display = 'block'; return; }
    if(birth && death && death < birth){ err.textContent = 'Date of death is before date of birth.'; err.style.display = 'block'; return; }
    err.style.display = 'none';

    const motherId = motherSelectVal || null;
    const motherText = motherId ? '' : motherTextVal;

    if(!family){
      if(fatherId){ const f = getEntryById(fatherId); if(f && f.family) family = f.family; }
      else if(motherId){ const m = getEntryById(motherId); if(m && m.family) family = m.family; }
    }

    await loadEntries();
    if(usingSeedFallback){
      err.textContent = "Couldn't confirm the tree's current data just now — to avoid accidentally overwriting anyone, please wait a moment and try again.";
      err.style.display = 'block';
      return;
    }
    if(editingId){
      const idx = entries.findIndex(e=>e.id === editingId);
      if(idx !== -1){
        entries[idx] = {...entries[idx], name, gender, fatherId, motherId, motherText, family, birth, death, photo: pendingPhotoData};
      }
    } else {
      entries.push({
        id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
        name, gender, fatherId, motherId, motherText, family, birth, death, photo: pendingPhotoData
      });
    }
    await saveEntries();
    cancelEdit();
    renderAll();
  });

  document.getElementById('f-cancel').addEventListener('click', cancelEdit);

  document.getElementById('zoom-in').addEventListener('click', ()=>{
    zoomLevel = Math.min(3, zoomLevel * 1.2);
    renderTree();
  });
  document.getElementById('zoom-out').addEventListener('click', ()=>{
    zoomLevel = Math.max(0.3, zoomLevel / 1.2);
    renderTree();
  });
  document.getElementById('zoom-reset').addEventListener('click', ()=>{
    zoomLevel = 1;
    renderTree();
  });

  document.getElementById('export-btn').addEventListener('click', async ()=>{
    await loadEntries();
    const blob = new Blob([JSON.stringify({entries, exportedAt: new Date().toISOString()}, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'family-tree-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('import-btn').addEventListener('click', ()=>{
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        const incoming = Array.isArray(parsed) ? parsed : (parsed.entries || []);
        if(!Array.isArray(incoming)) throw new Error('Unrecognized file format');
        const confirmMsg = 'Import ' + incoming.length + ' people from this backup? This replaces everyone currently in the tree.';
        if(!window.confirm(confirmMsg)) return;
        entries = incoming;
        await saveEntries();
        renderAll();
        alert('Import complete.');
      }catch(e){
        alert("Couldn't read that file — make sure it's a backup exported from this tree.");
      }
      ev.target.value = '';
    };
    reader.readAsText(file);
  });

  document.getElementById('refresh-btn').addEventListener('click', async (ev)=>{
    const btn = ev.currentTarget;
    const original = btn.textContent;
    btn.textContent = '…';
    btn.disabled = true;
    await refreshFromStorage();
    btn.textContent = 'updated';
    setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 1200);
  });
  document.getElementById('print-btn').addEventListener('click', ()=>{
    try{ window.print(); }
    catch(e){ }
  });

  document.getElementById('photo-lightbox').addEventListener('click', ()=>{
    document.getElementById('photo-lightbox').style.display = 'none';
  });

  document.getElementById('change-pins-btn').addEventListener('click', ()=>{
    document.getElementById('cp-which').value = 'access';
    document.getElementById('cp-current').value = '';
    document.getElementById('cp-new').value = '';
    document.getElementById('cp-new-confirm').value = '';
    document.getElementById('cp-err').style.display = 'none';
    document.getElementById('change-pins-overlay').style.display = 'flex';
  });
  document.getElementById('cp-cancel').addEventListener('click', ()=>{
    document.getElementById('change-pins-overlay').style.display = 'none';
  });
  document.getElementById('cp-submit').addEventListener('click', async ()=>{
    const which = document.getElementById('cp-which').value;
    const current = document.getElementById('cp-current').value.trim();
    const newPin = document.getElementById('cp-new').value.trim();
    const confirmPin = document.getElementById('cp-new-confirm').value.trim();
    const err = document.getElementById('cp-err');
    const currentHash = which === 'access' ? accessPinHash : adminPinHash;
    if(!currentHash){ err.textContent = 'No PIN has been set yet for this — nothing to change.'; err.style.display = 'block'; return; }
    if(simpleHash(current) !== currentHash){ err.textContent = 'Current PIN is incorrect.'; err.style.display = 'block'; return; }
    if(newPin.length < 4){ err.textContent = 'New PIN must be at least 4 characters.'; err.style.display = 'block'; return; }
    if(newPin !== confirmPin){ err.textContent = "New PINs don't match."; err.style.display = 'block'; return; }
    const newHash = simpleHash(newPin);
    if(which === 'access'){
      await saveAccessPin(newHash);
      accessPinHash = newHash;
      localStorage.setItem(ACCESS_TOKEN_KEY, newHash);
    } else {
      await saveAdmin(newHash);
      adminPinHash = newHash;
    }
    document.getElementById('change-pins-overlay').style.display = 'none';
    alert('PIN changed.' + (which === 'access' ? ' Everyone else will need the new PIN next time they open the tree.' : ''));
  });

  document.getElementById('pin-cancel').addEventListener('click', closePinModal);
  document.getElementById('pin-submit').addEventListener('click', async ()=>{
    const mode = document.getElementById('pin-overlay').dataset.mode;
    const pin = document.getElementById('pin-input').value.trim();
    const err = document.getElementById('pin-err');
    if(mode === 'set'){
      const confirmPin = document.getElementById('pin-confirm').value.trim();
      if(pin.length < 4){ err.textContent = 'Use at least 4 characters.'; err.style.display = 'block'; return; }
      if(pin !== confirmPin){ err.textContent = "PINs don't match."; err.style.display = 'block'; return; }
      const hash = simpleHash(pin);
      adminPinHash = hash;
      await saveAdmin(hash);
    } else {
      const hash = simpleHash(pin);
      if(hash !== adminPinHash){ err.textContent = 'Incorrect PIN.'; err.style.display = 'block'; return; }
    }
    const id = pendingDeleteId;
    closePinModal();
    if(id) await performDelete(id);
  });

  renderAll();
  updateConnectionBanner();
  startRealtimeSync();
}

window.addEventListener('beforeprint', ()=>{
  const layout = document.querySelector('.layout');
  const canvasPanel = document.querySelector('.canvas-panel');
  const sideCol = document.querySelector('.side-col');
  if(layout && canvasPanel && sideCol) layout.insertBefore(canvasPanel, sideCol);
});
window.addEventListener('afterprint', ()=>{
  const layout = document.querySelector('.layout');
  const canvasPanel = document.querySelector('.canvas-panel');
  const sideCol = document.querySelector('.side-col');
  if(layout && canvasPanel && sideCol) layout.insertBefore(sideCol, canvasPanel);
});

const ACCESS_TOKEN_KEY = 'family-tree-access-token';

function renderAccessGate(mode, currentAccessPinHash){
  const app = document.getElementById('app');
  app.classList.remove('loading');
  const isSet = mode === 'set';
  app.innerHTML =
    '<div class="panel" style="max-width:360px;margin:60px auto;">'
    + '<h2>' + (isSet ? 'Set the family PIN' : 'Enter the family PIN') + '</h2>'
    + '<p class="hint">' + (isSet
        ? 'No one has set an access PIN for this tree yet. Choose one now, then share it privately with the family members you want to have access.'
        : 'This tree is protected. Ask whoever shared this link with you for the PIN.') + '</p>'
    + '<label>PIN</label><input id="gate-pin" type="password">'
    + (isSet ? '<label>Confirm PIN</label><input id="gate-pin-confirm" type="password">' : '')
    + '<div class="err" id="gate-err"></div>'
    + '<button class="btn-primary" id="gate-submit">' + (isSet ? 'Set PIN and continue' : 'Continue') + '</button>'
    + '</div>';

  document.getElementById('gate-submit').addEventListener('click', async ()=>{
    const pin = document.getElementById('gate-pin').value.trim();
    const err = document.getElementById('gate-err');
    if(isSet){
      const confirmPin = document.getElementById('gate-pin-confirm').value.trim();
      if(pin.length < 4){ err.textContent = 'Use at least 4 characters.'; err.style.display = 'block'; return; }
      if(pin !== confirmPin){ err.textContent = "PINs don't match."; err.style.display = 'block'; return; }
      const hash = simpleHash(pin);
      await saveAccessPin(hash);
      accessPinHash = hash;
      localStorage.setItem(ACCESS_TOKEN_KEY, hash);
      renderApp();
    } else {
      const hash = simpleHash(pin);
      if(hash !== currentAccessPinHash){ err.textContent = 'Incorrect PIN.'; err.style.display = 'block'; return; }
      localStorage.setItem(ACCESS_TOKEN_KEY, hash);
      renderApp();
    }
  });
}

(async function init(){
  await loadEntries();
  await loadAdmin();
  accessPinHash = await loadAccessPin();
  const savedToken = localStorage.getItem(ACCESS_TOKEN_KEY);
  if(!accessPinHash){
    renderAccessGate('set', null);
  } else if(savedToken === accessPinHash){
    renderApp();
  } else {
    renderAccessGate('enter', accessPinHash);
  }
})();
</script>
